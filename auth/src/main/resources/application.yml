    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG

auth:
  server:
    issuer: http://localhost:8081
    access-token-ttl-hours: 1
    refresh-token-ttl-days: 7

  client:
    nextjs:
      id: nextjs-client
      redirect-uri: http://localhost:3000/callback
